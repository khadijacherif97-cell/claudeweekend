<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dressing — Rent the closet next door</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1A1A2E;
  --rose:#E8C4C4;
  --warm:#F7F3F0;
  --linen:#EDE8E3;
  --rose-dark:#d4a0a0;
  --navy-light:#2d2d4e;
  --text-muted:#888;
  --radius:16px;
  --radius-sm:10px;
}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--warm);color:var(--navy);min-height:100vh;overflow-x:hidden}
h1,h2,h3,.serif{font-family:Georgia,serif}

/* Layout */
#app{display:flex;height:100vh;overflow:hidden;background:#f0ebe6}
.phone{width:390px;min-width:390px;height:100%;background:var(--warm);overflow:hidden;position:relative;flex-shrink:0;border-right:1px solid var(--linen)}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--warm);transition:opacity .3s ease,transform .3s ease}
.screen.hidden{opacity:0;pointer-events:none;transform:translateX(20px)}

/* Nav sidebar */
.nav-sidebar{flex:1;background:var(--navy);padding:48px 32px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.nav-section-label{color:var(--rose);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin:20px 0 8px;padding-left:12px}
.nav-btn{background:transparent;border:none;color:rgba(255,255,255,.6);font-family:inherit;font-size:14px;font-weight:500;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;transition:all .15s;width:100%}
.nav-btn:hover{background:rgba(255,255,255,.08);color:white}
.nav-btn.active{background:var(--rose);color:var(--navy);font-weight:600}
.nav-title{color:white;font-family:Georgia,serif;font-size:22px;font-weight:normal;margin-bottom:4px}
.nav-sub{color:rgba(255,255,255,.4);font-size:12px;margin-bottom:32px}

/* Common components */
.btn-primary{background:var(--navy);color:white;border:none;border-radius:var(--radius-sm);padding:16px 24px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:all .2s}
.btn-primary:hover{background:var(--navy-light)}
.btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--navy);border-radius:var(--radius-sm);padding:14px 24px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:all .2s}
.btn-rose{background:var(--rose);color:var(--navy);border:none;border-radius:var(--radius-sm);padding:14px 24px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.chip{background:var(--linen);color:var(--navy);border:none;border-radius:20px;padding:8px 16px;font-family:inherit;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.chip.active{background:var(--navy);color:white}
.badge{background:var(--rose);color:var(--navy);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600}
.badge-green{background:#d4edda;color:#1a5c2a;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600}
.tag{background:var(--linen);color:var(--navy);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:500}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:sticky;top:0;background:var(--warm);z-index:10;border-bottom:1px solid var(--linen)}
.topbar-title{font-family:Georgia,serif;font-size:18px}
.back-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--navy);padding:4px;line-height:1}
.icon-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--navy);padding:4px;line-height:1}

/* Progress bar */
.progress-bar{height:3px;background:var(--linen);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--navy);border-radius:2px;transition:width .4s ease}

/* Cards */
.card{background:white;border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 12px rgba(26,26,46,.06)}
.card-p{padding:20px}

/* Image placeholders */
.img-placeholder{background:linear-gradient(135deg,var(--linen) 0%,var(--rose) 100%);display:flex;align-items:center;justify-content:center;font-size:32px;color:white}

/* Bottom nav */
.bottom-nav{display:flex;position:sticky;bottom:0;background:white;border-top:1px solid var(--linen);z-index:20}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;gap:3px;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--text-muted);font-size:10px;font-weight:500;transition:color .15s}
.bnav-item.active{color:var(--navy)}
.bnav-icon{font-size:20px;line-height:1}

/* Form */
.form-group{margin-bottom:16px}
.form-label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;display:block}
.form-input{width:100%;padding:12px 14px;border:1.5px solid var(--linen);border-radius:var(--radius-sm);font-family:inherit;font-size:15px;background:white;outline:none;transition:border-color .2s;color:var(--navy)}
.form-input:focus{border-color:var(--navy)}

/* Avatar */
.avatar{border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--rose),var(--linen));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--navy);flex-shrink:0}

/* Stars */
.stars{color:#f4b942;font-size:14px;letter-spacing:1px}

/* Divider */
.divider{height:1px;background:var(--linen);margin:16px 0}

/* Item card */
.item-card{border-radius:var(--radius);overflow:hidden;background:white;cursor:pointer}
.item-img{width:100%;aspect-ratio:3/4;object-fit:cover}
.item-info{padding:10px 12px 12px}
.item-name{font-size:13px;font-weight:600;margin-bottom:2px;line-height:1.3}
.item-lender{font-size:11px;color:var(--text-muted)}
.item-price{font-size:13px;font-weight:700;color:var(--navy);margin-top:6px}

/* Lender card */
.lender-card{display:flex;align-items:center;gap:12px;padding:14px;background:white;border-radius:var(--radius);cursor:pointer}

/* Status pill */
.status-pill{border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;display:inline-block}
.status-active{background:#d4edda;color:#1a5c2a}
.status-pending{background:#fff3cd;color:#856404}
.status-returned{background:var(--linen);color:var(--text-muted)}
.status-paused{background:#f8d7da;color:#842029}

/* Earnings */
.earnings-big{font-family:Georgia,serif;font-size:42px;font-weight:normal;color:var(--navy)}
.earnings-label{font-size:12px;color:var(--text-muted);font-weight:500}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade-up{animation:fadeUp .4s ease both}
.spinner{width:28px;height:28px;border:2.5px solid var(--linen);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--linen);border-radius:2px}

/* Quiz option */
.quiz-option{border:1.5px solid var(--linen);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer;transition:all .2s;background:white;font-family:inherit;font-size:14px;color:var(--navy);text-align:left;width:100%;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.quiz-option.selected{border-color:var(--navy);background:var(--navy);color:white}
.quiz-option-emoji{font-size:20px;width:28px;text-align:center}

/* Silhouette */
.silhouette-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.silhouette-card{border:1.5px solid var(--linen);border-radius:12px;padding:16px 8px;text-align:center;cursor:pointer;transition:all .2s;background:white}
.silhouette-card.selected{border-color:var(--navy);background:var(--navy);color:white}
.silhouette-svg{font-size:36px;display:block;margin:0 auto 8px}
.silhouette-label{font-size:11px;font-weight:600}

/* Feed */
.editorial-card{border-radius:var(--radius);overflow:hidden;position:relative;cursor:pointer}
.editorial-img{width:100%;aspect-ratio:4/5;object-fit:cover}
.editorial-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(26,26,46,.85));padding:20px 16px 16px}
.editorial-label{color:white;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;opacity:.8}
.editorial-title{color:white;font-family:Georgia,serif;font-size:18px;line-height:1.3}
.rent-pill{background:var(--rose);color:var(--navy);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;border:none;cursor:pointer;margin-top:8px;display:inline-block}

.ugc-card{border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative}
.ugc-img{width:100%;aspect-ratio:3/4;object-fit:cover}
.ugc-overlay{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(26,26,46,.7))}
.ugc-name{color:white;font-size:12px;font-weight:600}
.ugc-item{color:rgba(255,255,255,.8);font-size:11px}
.verified-badge{background:var(--rose);color:var(--navy);font-size:9px;font-weight:700;border-radius:10px;padding:2px 6px;display:inline-block;margin-left:4px}

/* Calendar */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:all .15s}
.cal-day.available:hover{background:var(--rose)}
.cal-day.selected{background:var(--navy);color:white}
.cal-day.range{background:var(--rose);color:var(--navy)}
.cal-day.unavailable{color:var(--linen);cursor:not-allowed}
.cal-day.header{font-size:11px;font-weight:600;color:var(--text-muted);cursor:default}

/* Checkout row */
.checkout-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--linen)}
.checkout-row:last-child{border-bottom:none}
.checkout-total{font-size:16px;font-weight:700}

/* Review stars */
.review-star{font-size:32px;cursor:pointer;transition:transform .1s}
.review-star:hover{transform:scale(1.2)}

/* Rental status card */
.rental-card{background:white;border-radius:var(--radius);padding:16px;margin-bottom:12px}
.rental-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--linen);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.countdown{font-family:Georgia,serif;font-size:18px;color:var(--navy);font-weight:normal}
.countdown-label{font-size:11px;color:var(--text-muted)}

/* Chart bar */
.chart-bar{background:var(--rose);border-radius:4px 4px 0 0;flex:1;min-width:0;transition:height .4s ease;position:relative;cursor:pointer}
.chart-bar:hover{background:var(--rose-dark)}
.chart-container{display:flex;align-items:flex-end;gap:6px;height:80px}
.chart-label{font-size:10px;color:var(--text-muted);text-align:center;margin-top:4px}

/* AI typing animation */
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.cursor{display:inline-block;width:2px;height:14px;background:var(--navy);margin-left:2px;animation:blink .8s infinite;vertical-align:middle}

/* Coaching overlay */
.camera-overlay{position:relative;background:#111;border-radius:var(--radius);overflow:hidden;aspect-ratio:3/4}
.camera-guide{position:absolute;inset:16px;border:2px dashed rgba(255,255,255,.4);border-radius:12px;display:flex;align-items:center;justify-content:center}
.camera-tip{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:white;font-size:13px;font-weight:600;background:rgba(0,0,0,.5);padding:8px;backdrop-filter:blur(4px)}
</style>
</head>

let quizAnswers = {};

let reviewStars = 0;

function nav(screen) {
  currentScreen = screen;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[onclick="nav('${screen}')"]`)?.classList.add('active');
  render();
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  const phone = document.getElementById('phone');
  const screens = {
    splash: renderSplash,
    quiz: renderQuiz,
    fit: renderFit,
    instagram: renderInstagram,
    home: renderHome,
    search: renderSearch,

    additem: renderAddItem,
    items: renderItems,
    earnings: renderEarnings,
    booking: renderBooking,
    activerental: renderActiveRental,
  };
  phone.innerHTML = (screens[currentScreen] || renderSplash)();
  // re-attach events after render
  attachEvents();
}

function renderQuiz() {
  const q = QUIZ_QUESTIONS[quizStep];
  const pct = Math.round(((quizStep+1)/QUIZ_QUESTIONS.length)*100);
  const selected = quizAnswers[quizStep] || (q.multi ? [] : null);
  return `
<div class="screen fade-up" style="min-height:100vh;display:flex;flex-direction:column;padding:0">
  <div style="padding:20px 20px 0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">

      <span style="font-size:13px;color:var(--text-muted);font-weight:500">${quizStep+1} / ${QUIZ_QUESTIONS.length}</span>
      <div style="width:32px"></div>
    </div>
    <div class="progress-bar" style="margin-bottom:32px"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div style="font-family:Georgia,serif;font-size:26px;line-height:1.25;margin-bottom:8px">${q.q}</div>
    <div style="font-size:14px;color:var(--text-muted);margin-bottom:28px">${q.sub}</div>
  </div>
  <div style="padding:0 20px;flex:1">
    ${q.options.map((o,i)=>{
      const isSel = q.multi ? (selected||[]).includes(o.val) : selected===o.val;
      return `<button class="quiz-option${isSel?' selected':''}" onclick="quizSelect(${quizStep},${JSON.stringify(o.val)},${!!q.multi})">
        <span class="quiz-option-emoji">${o.emoji}</span>
        <span>${o.label}</span>
      </button>`;
    }).join('')}
  </div>
  <div style="padding:20px">
    <button class="btn-primary" onclick="quizNext()" ${(!selected || (Array.isArray(selected)&&!selected.length))?'style="opacity:.4"':''}>
      ${quizStep===QUIZ_QUESTIONS.length-1?'Voir mes résultats':'Continuer →'}
    </button>
  </div>
</div>`;
}

// ── EVENT LOGIC ───────────────────────────────────────────────────────────
function attachEvents() {}

function quizSelect(step, val, isMulti) {
  if (isMulti) {
    const arr = quizAnswers[step] || [];
    const idx = arr.indexOf(val);
    if (idx === -1) arr.push(val); else arr.splice(idx, 1);
    quizAnswers[step] = arr;
  } else {
    quizAnswers[step] = val;
  }
  render();
}
function quizNext() {
  if (quizStep < QUIZ_QUESTIONS.length - 1) { quizStep++; render(); }
  else { nav('fit'); }
}
function quizBack() { if (quizStep > 0) { quizStep--; render(); } }
function setStars(n) { reviewStars = n; render(); }

// ── INIT ──────────────────────────────────────────────────────────────────
render();
